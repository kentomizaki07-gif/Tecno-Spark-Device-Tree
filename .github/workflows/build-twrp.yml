name: Build KN4 TWRP

# Put the CONTENTS of this folder at the root of your own GitHub repo
# (BoardConfig.mk must be at the top level). Then: Actions > Build KN4 recovery > Run workflow.

on:
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: "TWRP minimal manifest branch"
        default: "twrp-12.1"
        required: true
      build_target:
        description: "Build target"
        default: "vendorbootimage"
        required: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 340
    env:
      MANIFEST_BRANCH: ${{ github.event.inputs.manifest_branch }}
      BUILD_TARGET: ${{ github.event.inputs.build_target }}
    steps:
      - name: Get the device tree (this repo)
        uses: actions/checkout@v4
        with:
          path: tree

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Install build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libc6-dev-i386 libncurses5 x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev \
            libxml2-utils xsltproc unzip fontconfig python3 python-is-python3 lz4 cpio bc rsync
          mkdir -p "$HOME/bin"
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name  "builder"
          git config --global user.email "builder@example.com"

      - name: Sync TWRP minimal manifest
        run: |
          mkdir twrp && cd twrp
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b "$MANIFEST_BRANCH"
          repo sync -c -j8 --force-sync --no-clone-bundle --no-tags
          df -h /

      - name: Copy device tree into the source
        run: |
          mkdir -p twrp/device/tecno/KN4
          rsync -a --exclude .git --exclude .github tree/ twrp/device/tecno/KN4/

      - name: Build
        run: |
          cd twrp
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          lunch twrp_KN4-eng
          mka -j"$(nproc)" "$BUILD_TARGET" 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Collect results
        if: always()
        run: |
          mkdir -p artifacts
          OUT=twrp/out/target/product/KN4
          ls -l "$OUT" 2>/dev/null | tee artifacts/out-listing.txt || true
          cp build.log artifacts/ 2>/dev/null || true
          if [ -f "$OUT/vendor_boot.img" ]; then
            cp "$OUT/vendor_boot.img" artifacts/vendor_boot_built.img
            python3 tree/tools/extract_recovery_fragment.py artifacts/vendor_boot_built.img artifacts/recovery.cpio.lz4 | tee artifacts/extract.log
          else
            echo "vendor_boot.img not found in $OUT" | tee artifacts/extract.log
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KN4-recovery
          path: artifacts/*
